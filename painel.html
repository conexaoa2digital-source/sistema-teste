<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--navy:#0B1F4D;--blue:#2F6BFF;--blue-2:#1846C8;--soft:#EEF3FF;--line:#ECEEF3;--bg:#F6F7F9;--ink:#0B1F4D;--muted:#6B7385;--ok:#0E7A4A;--ok-soft:#E3F6EC;--bad:#C8283C;--bad-soft:#FDECEE;--warn:#8A5300;--warn-soft:#FFF5E3}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{font-family:Sora,Inter,sans-serif;letter-spacing:-.02em;margin:0}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:10px;border:1px solid #DDE1E8;background:#fff;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--bg)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}.btn.pri:hover{background:#2559E0}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:17px;height:17px}
.in{width:100%;height:42px;border:1px solid #DDE1E8;border-radius:10px;padding:0 12px;background:#fff;font-size:15px}
textarea.in{height:auto;padding:10px 12px;resize:vertical;line-height:1.45}
.in:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,107,255,.12)}
.ico-s{flex:none;width:38px;height:38px;border-radius:10px;border:0;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center}
.ico-s:hover,.ico-s[aria-expanded="true"]{background:var(--bg);color:var(--ink)}
.ico-r{flex:none;width:42px;height:42px;border-radius:21px;border:0;background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center}
.ico-r:hover{background:#ECEEF3}
.ico-r.pri{background:var(--blue);color:#fff}
.logo-mark{width:28px;height:28px;display:block;flex:none}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:7px;white-space:nowrap}
.p-lead{background:var(--soft);color:var(--blue-2)}.p-cli{background:var(--ok-soft);color:var(--ok)}.p-gray{background:#F0F2F5;color:var(--muted)}
.erro{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:14px}

/* login */
.login{min-height:100%;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
.login form{width:min(400px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;padding:32px;display:flex;flex-direction:column;gap:16px}
.login .logo-mark{width:36px;height:36px}
.wordmark{display:flex;align-items:center;gap:10px;font-family:Sora;font-weight:600;font-size:24px;letter-spacing:-.045em}
.wordmark i{display:inline-block;width:.2em;height:.2em;border-radius:.05em;background:var(--blue);margin-left:.05em}
.login label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.demo-tag{font-size:12.5px;color:var(--muted);text-align:center;margin:0}

/* casca */
.app{display:flex;height:100%;height:100dvh;overflow:hidden}
.main{flex:1;min-width:0;display:flex}

/* lista */
.lista{flex:0 0 340px;border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;background:#fff}
.lista-top{padding:14px 16px 0;display:flex;flex-direction:column;gap:12px}
.lista-top .t{display:flex;align-items:center;gap:10px}
.lista-top h1{font-size:19px}
.off{font-size:12px;font-weight:600;color:var(--warn);background:var(--warn-soft);padding:4px 8px;border-radius:6px}
.busca{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:10px;padding:0 12px;height:38px;color:var(--muted)}
.busca svg{width:17px;height:17px}
.busca input{border:0;background:transparent;outline:none;flex:1;font-size:14px;min-width:0;color:var(--ink)}
.abas{display:flex;gap:20px;border-bottom:1px solid var(--line);margin:0 -16px;padding:0 16px}
.abas button{border:0;background:none;padding:6px 0 10px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;align-items:center;gap:6px}
.abas button:hover{color:var(--ink)}
.abas button[aria-selected="true"]{color:var(--ink);border-color:var(--ink)}
.abas .n{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--blue);color:#fff;font-size:11px;line-height:18px;text-align:center}
.itens{flex:1;overflow-y:auto;padding:6px 0}
.item{position:relative;display:flex;gap:12px;align-items:center;padding:11px 16px;border:0;background:#fff;width:100%;text-align:left}
.item:hover{background:#FAFBFC}
.item[aria-current="true"]{background:var(--soft)}
.item.need::before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--blue)}
.av{flex:none;width:40px;height:40px;border-radius:20px;background:#EDEFF3;color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px}
.item .c{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.l1,.l2{display:flex;align-items:center;gap:8px;min-width:0}
.item .n{flex:1;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .h{font-size:12px;color:var(--muted);flex:none}
.item .m{flex:1;font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .m.need{color:var(--blue-2);font-weight:600}
.un{flex:none;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--blue);color:#fff;font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.vazio{padding:40px 24px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5}
.demo-pe{display:flex;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}

/* conversa */
.chat{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
.vazio-chat{margin:auto;display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--muted);font-size:15px}
.vazio-chat .logo-mark{width:44px;height:44px;opacity:.9}
.chat-top{display:flex;align-items:center;gap:8px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);min-height:64px}
.who{display:flex;align-items:center;gap:10px;border:0;background:none;padding:4px 10px 4px 4px;border-radius:12px;min-width:0;text-align:left}
.who:hover{background:var(--bg)}
.who .av{width:38px;height:38px;font-size:13px}
.wt{display:flex;flex-direction:column;min-width:0}
.wt b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st.need{color:var(--blue-2);font-weight:600}
.chat-top .voltar{display:none}
.msgs{flex:1;overflow-y:auto;padding:20px max(20px,calc((100% - 780px)/2));display:flex;flex-direction:column;gap:6px}
.dia{align-self:center;font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 6px}
.b{max-width:min(75%,540px);display:flex;flex-direction:column}
.b.ent{align-self:flex-start}.b.sai{align-self:flex-end}
.bx{border-radius:14px;padding:8px 12px 6px;font-size:15px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.b.ent .bx{background:#fff;border:1px solid var(--line)}
.b.anab .bx{background:var(--soft)}
.b.eq .bx{background:var(--blue);color:#fff}
.meta{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap}
.b.eq .meta{color:#DCE6FF}
.meta svg{width:14px;height:14px}
.meta .lida{color:#7FD3FF}.b.anab .meta .lida{color:var(--blue)}
.falhou{color:var(--bad);font-size:12px;font-weight:600}
.b.eq .falhou{color:#FFD5DA}
.sis{align-self:center;font-size:12.5px;color:var(--muted);text-align:center;max-width:80%;margin:8px 0;line-height:1.4}
.foto{display:block;max-width:260px;max-height:300px;border-radius:8px;cursor:zoom-in;background:#E7ECF7;min-width:120px;min-height:80px}
.doc{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;background:rgba(11,31,77,.05);color:inherit;text-decoration:none;font-weight:600}
.b.eq .doc{background:rgba(255,255,255,.16)}
audio{width:240px;max-width:100%;height:36px;display:block}
.trans{margin-top:6px;font-size:14px}
.trans small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.05em;color:var(--muted);margin-bottom:1px}
.b.eq .trans small{color:#DCE6FF}
.tpl{font-size:11px;font-weight:700;letter-spacing:.04em;opacity:.75;margin-bottom:2px}
.comp{background:#fff;border-top:1px solid var(--line);padding:10px max(20px,calc((100% - 780px)/2)) calc(10px + env(safe-area-inset-bottom))}
.linha{display:flex;align-items:flex-end;gap:6px}
.linha .ico-s{height:42px}
.txt{flex:1;width:100%;min-width:0;min-height:42px;max-height:160px;border:1px solid var(--line);border-radius:21px;padding:10px 16px;resize:none;font-size:15px;line-height:1.4;background:var(--bg)}
.txt:focus{outline:none;border-color:#C9D3EA;background:#fff}
.fechada{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted)}
.gravando{flex:1;display:flex;align-items:center;gap:10px;height:42px;padding:0 16px;border-radius:21px;background:var(--bad-soft);color:var(--bad);font-weight:600;font-size:14px}
.gravando .dot{width:9px;height:9px;border-radius:5px;background:var(--bad);animation:pisca 1s infinite}
@keyframes pisca{50%{opacity:.25}}
.anexo{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 10px;margin-bottom:8px;border-radius:12px;background:var(--bg);font-size:14px}
.anexo img{width:40px;height:40px;object-fit:cover;border-radius:6px}

/* ficha (gaveta) */
.ficha{position:fixed;top:0;right:0;bottom:0;width:min(360px,100%);background:#fff;border-left:1px solid var(--line);box-shadow:-24px 0 48px -28px rgba(11,31,77,.3);z-index:35;overflow-y:auto;padding:14px 20px 24px;display:flex;flex-direction:column;gap:16px;transform:translateX(100%);visibility:hidden;transition:transform .2s ease,visibility 0s .2s}
.ficha.aberta{transform:none;visibility:visible;transition:transform .2s ease}
.f-top{display:flex;align-items:center}
.f-top h2{font-size:16px}
.ficha .topo{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.ficha .topo .av{width:64px;height:64px;border-radius:32px;font-size:22px}
.ficha .nome{border:0;text-align:center;font-weight:700;font-size:17px;width:100%;background:transparent;border-radius:8px;padding:4px}
.ficha .nome:hover,.ficha .nome:focus{background:var(--bg);outline:none}
.ficha .tel{color:var(--muted);font-size:14px}
.campo{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.salvo{font-size:12px;color:var(--ok);font-weight:600}
.f-info{margin:0;font-size:13px;color:var(--muted)}

/* menus */
.pop{position:fixed;z-index:45;min-width:220px;max-width:min(380px,calc(100vw - 16px));max-height:60vh;overflow-y:auto;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 40px -12px rgba(11,31,77,.28);padding:6px}
.pop button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 10px;border-radius:8px;font-size:14px;text-align:left}
.pop button:hover,.pop button:focus{background:var(--bg);outline:none}
.pop button.perigo{color:var(--bad)}
.pop svg{width:18px;height:18px;color:var(--muted)}
.pop button.perigo svg{color:var(--bad)}
.pop .rp{display:flex;flex-direction:column;gap:2px;min-width:0}
.pop small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:330px}

/* configurações */
.pag{flex:1;overflow-y:auto;padding:24px clamp(16px,4vw,48px) 48px;background:var(--bg)}
.pag .w{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.pag h1{font-size:24px}
.link{align-self:flex-start;display:inline-flex;align-items:center;gap:4px;border:0;background:none;padding:6px 8px 6px 2px;margin-left:-2px;color:var(--muted);font-weight:600;font-size:14px;border-radius:8px}
.link:hover{color:var(--ink)}
.link svg{width:18px;height:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
.card h2{font-size:16px}
.card p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.sw{display:flex;align-items:center;gap:14px;cursor:pointer}
.sw input{width:44px;height:26px;appearance:none;-webkit-appearance:none;border-radius:13px;background:#C9D0DC;position:relative;cursor:pointer;transition:background .15s;flex:none;margin:0}
.sw input::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:10px;background:#fff;transition:transform .15s}
.sw input:checked{background:var(--blue)}.sw input:checked::after{transform:translateX(18px)}
.sw b{display:block;font-size:15px}.sw small{display:block;color:var(--muted);font-size:13.5px;margin-top:2px}
.rr{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.rr:last-child{border-bottom:0}
.rr p{margin:2px 0 0;font-size:13.5px}
.rr select.in{height:36px;width:auto;font-size:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

/* avisos e janelas */
.toasts{position:fixed;right:16px;top:76px;display:flex;flex-direction:column;gap:8px;z-index:50}
.toast{background:var(--navy);color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;box-shadow:0 12px 30px -10px rgba(0,0,0,.4);max-width:360px}
.toast.err{background:var(--bad)}
.modal{position:fixed;inset:0;background:rgba(6,18,46,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
.modal .card{width:min(500px,100%);max-height:90vh;overflow:auto}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:60;cursor:zoom-out}
.lb img{max-width:94vw;max-height:94vh;border-radius:8px}

/* celular */
@media (max-width:860px){
  .lista{flex:1;border-right:0}
  .app.em-chat .lista{display:none}
  .app:not(.em-chat) .chat{display:none}
  .chat-top{padding:8px 8px;gap:4px}
  .chat-top .voltar{display:inline-flex}
  .msgs{padding:14px 12px}
  .comp{padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
  .b{max-width:85%}
  .grid2{grid-template-columns:1fr}
}

/* ===== cor e profundidade ===== */
.login{background:radial-gradient(900px 600px at 70% 15%,#1A3A85,#0B1F4D 55%,#06122E)}
.login form{border:0;box-shadow:0 40px 80px -30px rgba(0,0,0,.55)}
.lista{background:linear-gradient(180deg,#0E2558,#0B1F4D 40%,#091A40);border-right:0;color:#fff}
.lista-top h1{color:#fff}
.lista .ico-s{color:#A9B7D6}.lista .ico-s:hover,.lista .ico-s[aria-expanded="true"]{background:rgba(255,255,255,.1);color:#fff}
.lista .busca{background:rgba(255,255,255,.08);color:#9AA9CB}
.lista .busca input{color:#fff}.lista .busca input::placeholder{color:#8C9BBD}
.lista .abas{border-color:rgba(255,255,255,.1)}
.lista .abas button{color:#8C9BBD}.lista .abas button:hover{color:#fff}
.lista .abas button[aria-selected="true"]{color:#fff;border-color:#6B95FF}
.lista .item{background:transparent;color:#fff;border-radius:12px;width:calc(100% - 16px);margin:1px 8px;padding:11px 10px}
.lista .item:hover{background:rgba(255,255,255,.06)}
.lista .item[aria-current="true"]{background:rgba(47,107,255,.28)}
.lista .item.need::before{left:-8px;background:#6B95FF}
.lista .item .h,.lista .item .m{color:#93A2C3}
.lista .item .m.need{color:#9DBBFF}
.lista .vazio{color:#93A2C3}
.lista .demo-pe{border-color:rgba(255,255,255,.1);color:#8C9BBD}
.lista .demo-pe .btn{background:rgba(255,255,255,.1);border-color:transparent;color:#fff}
.lista .demo-pe .btn:hover{background:rgba(255,255,255,.16)}
.lista .logo-mark>rect:first-child{fill:#17336F}
.chat{background:radial-gradient(1200px 500px at 85% -10%,#DCE6FB,transparent 60%),linear-gradient(180deg,#EFF3FA,#E7ECF5)}
.chat-top{border-bottom:0;box-shadow:0 1px 0 rgba(11,31,77,.06),0 8px 20px -14px rgba(11,31,77,.25);position:relative;z-index:1}
.bx{box-shadow:0 1px 2px rgba(11,31,77,.08),0 6px 16px -10px rgba(11,31,77,.18)}
.b.ent .bx{border:0;border-bottom-left-radius:5px}
.b.sai .bx{border-bottom-right-radius:5px}
.b.anab .bx{background:#DCE6FF}
.b.eq .bx{background:linear-gradient(135deg,#3B78FF,#2253E0);box-shadow:0 8px 18px -10px rgba(34,83,224,.7)}
.dia{background:rgba(255,255,255,.85);padding:4px 12px;border-radius:99px;box-shadow:0 1px 2px rgba(11,31,77,.06)}
.sis{background:rgba(255,255,255,.7);padding:6px 14px;border-radius:12px;color:#4A5A7A}
.comp{background:transparent;border-top:0;padding-top:6px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.comp .linha{background:#fff;border-radius:28px;padding:5px 5px 5px 8px;box-shadow:0 10px 30px -14px rgba(11,31,77,.35),0 1px 2px rgba(11,31,77,.06)}
.comp .txt,.comp .txt:focus{background:transparent;border-color:transparent}
.comp .anexo{background:#fff;box-shadow:0 6px 18px -12px rgba(11,31,77,.3)}
.fechada{background:#fff;border-radius:16px;padding:10px 12px 10px 16px;box-shadow:0 10px 30px -14px rgba(11,31,77,.35)}
.vazio-chat{color:#5B6A8A}
.ficha{box-shadow:-30px 0 60px -30px rgba(11,31,77,.45);border-left:0}
.btn.pri{box-shadow:0 6px 14px -8px rgba(47,107,255,.8)}

/* ---------- gravação de áudio ---------- */
async function gravar() {
  if (!navigator.mediaDevices || !window.MediaRecorder) return toast('Este navegador não grava áudio. Tente o Chrome.', true);
  let stream; try { stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } }); }
  catch { return toast('Permita o uso do microfone para gravar áudio.', true); }
  const tipos = ['audio/ogg;codecs=opus', 'audio/webm;codecs=opus', 'audio/mp4', 'audio/webm'];
  const mime = tipos.find(t => MediaRecorder.isTypeSupported(t)) || '';
  const rec = new MediaRecorder(stream, mime ? { mimeType: mime, audioBitsPerSecond: 32000 } : undefined), partes = [];
  rec.ondataavailable = e => e.data.size && partes.push(e.data);
  S.rec = { rec, stream, partes, ini: Date.now(), mime: rec.mimeType || mime, timer: setInterval(() => { const s = Math.floor((Date.now() - S.rec.ini) / 1000); const el = $('#recT'); if (el) el.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; if (s >= 300) pararGravacao(true); }, 250) };
  rec.start(250); renderComp();
}
function pararGravacao(enviarDepois) {
  const r = S.rec; if (!r) return; S.rec = null; clearInterval(r.timer);
  r.rec.onstop = async () => {
    r.stream.getTracks().forEach(t => t.stop());
    renderComp();
    if (!enviarDepois || Date.now() - r.ini < 700) return;
    try {
      let blob = new Blob(r.partes, { type: r.mime }), mime = r.mime.split(';')[0], nome = 'audio';
      if (/webm/.test(mime)) { const o = window.webmParaOgg(await blob.arrayBuffer()); blob = o.blob; mime = 'audio/ogg'; }
      nome += mime === 'audio/ogg' ? '.ogg' : mime === 'audio/mp4' ? '.m4a' : '.audio';
      await API.enviarMidia(S.sel, blob, { nome, mime: mime === 'audio/ogg' ? 'audio/ogg; codecs=opus' : mime });
    } catch (e) { toast('Não consegui enviar o áudio: ' + esc(e.message), true); }
  };
  r.rec.stop();
}

  document.body.appendChild(m); m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-fechar]')) m.remove(); });
  let L; try { L = await API.modelos(); } catch (e) { m.querySelector('.card').innerHTML = `<h2>Mensagem-modelo</h2><div class="erro">${esc(e.message)}</div><button class="btn" data-fechar>Fechar</button>`; return; }
  if (!L.length) { m.querySelector('.card').innerHTML = `<h2>Mensagem-modelo</h2><p>Ainda não há modelos aprovados. Crie um no Gerenciador do WhatsApp da Meta (WhatsApp Manager › Modelos de mensagem) e espere a aprovação.</p><button class="btn" data-fechar>Fechar</button>`; return; }
  const card = m.querySelector('.card');
  card.innerHTML = `<h2>Mensagem-modelo</h2><p>Escolha um modelo aprovado e preencha os campos.</p>
    <label class="campo">Modelo<select class="in" id="mSel">${L.map((t, i) => `<option value="${i}">${esc(t.name)}</option>`).join('')}</select></label>
    <div id="mCampos" style="display:flex;flex-direction:column;gap:10px"></div>
    <div class="bx" id="mPrev" style="background:var(--soft);border-radius:12px;padding:12px;font-size:14px;white-space:pre-wrap"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-fechar>Cancelar</button><button class="btn pri" id="mEnv">${ic('send')}Enviar</button></div>`;
  const vals = () => [...card.querySelectorAll('[data-p]')].map(i => i.value);
  const prev = () => { const t = L[$('#mSel', card).value]; const v = vals(); $('#mPrev', card).textContent = t.texto.replace(/\{\{(\d+)\}\}/g, (_, n) => v[n - 1] || `[campo ${n}]`); };
  const campos = () => { const t = L[$('#mSel', card).value]; $('#mCampos', card).innerHTML = Array.from({ length: t.params }, (_, i) => `<label class="campo">Campo ${i + 1}<input class="in" data-p="${i}" value="${i === 0 ? esc((c.contato.nome || '').split(' ')[0]) : ''}"></label>`).join(''); prev(); };
  $('#mSel', card).addEventListener('change', campos); card.addEventListener('input', prev); campos();
  $('#mEnv', card).addEventListener('click', async e => { e.target.disabled = true; try { const t = L[$('#mSel', card).value]; await API.enviarModelo(c.id, t, vals(), $('#mPrev', card).textContent); m.remove(); toast('Mensagem-modelo enviada'); } catch (x) { toast(esc(x.message), true); e.target.disabled = false; } });
}



/* =====================================================================
   ficha do contato (gaveta)
   ===================================================================== */
function renderFicha() {
  const el = $('#ficha'); if (!el) return;
  const c = S.convs.get(S.sel);
  el.classList.toggle('aberta', S.fichaAberta && !!c);
  if (!c) { el.innerHTML = ''; return; }
  const k = c.contato, ORIG = ['Instagram', 'Site', 'Indicação', 'Google', 'WhatsApp', 'Evento', 'Outro'];
  el.innerHTML = `<div class="f-top"><h2>Ficha do contato</h2><span class="sp"></span><button type="button" class="ico-s" data-a="ficha" aria-label="Fechar ficha">${ic('x')}</button></div>
    <div class="topo"><span class="av" aria-hidden="true" style="${avCor(k)}">${esc(avTxt(k))}</span>
      <label style="width:100%"><span class="sr">Nome</span><input class="nome" id="kNome" value="${esc(k.nome || '')}" placeholder="Sem nome"></label>
      <span class="tel">${esc(fone(k.wa_id))}</span>
      <span class="pill ${k.tipo === 'cliente' ? 'p-cli' : 'p-lead'}">${k.tipo === 'cliente' ? 'Cliente' : 'Lead'}</span></div>
    <label class="campo">Chegou por<select class="in" id="kOrig"><option value="">Não informado</option>${ORIG.map(o => `<option ${o === k.origem ? 'selected' : ''}>${o}</option>`).join('')}${k.origem && !ORIG.includes(k.origem) ? `<option selected>${esc(k.origem)}</option>` : ''}</select></label>
    <label class="campo">Empresa<input class="in" id="kEmp" value="${esc(k.empresas || '')}" placeholder="Ex.: 3 lojas de roupa"></label>
    <label class="campo"><span style="display:flex;justify-content:space-between">Anotações <span class="salvo" id="kSalvo" hidden>Salvo</span></span><textarea class="in" id="kNotas" rows="6" placeholder="O que combinou, próximo passo…">${esc(k.anotacoes || '')}</textarea></label>
    <p class="f-info">Primeiro contato em ${esc(new Date(k.criado_em || c.criado_em).toLocaleDateString('pt-BR'))}.</p>`;
  const salvar = debounce(async campos => { try { await API.atualizarContato(k.id, campos); const s = $('#kSalvo'); if (s) { s.hidden = false; setTimeout(() => s.hidden = true, 1500); } } catch (e) { toast(esc(e.message), true); } }, 600);
  $('#kNome', el).addEventListener('change', e => { k.nome = e.target.value.trim() || null; salvar({ nome: k.nome }); renderItens(); const b = $('.wt b'); if (b) b.textContent = nomeC(c); });
  $('#kOrig', el).addEventListener('change', e => { k.origem = e.target.value || null; salvar({ origem: k.origem }); });
  $('#kEmp', el).addEventListener('input', e => { k.empresas = e.target.value; salvar({ empresas: k.empresas }); });
  $('#kNotas', el).addEventListener('input', e => { k.anotacoes = e.target.value; salvar({ anotacoes: k.anotacoes }); });
}

/* =====================================================================
   cliques e ações
   ===================================================================== */
document.addEventListener('click', e => {
  const v = e.target.closest('[data-view]'); if (v) { S.view = v.dataset.view; render(); return; }
  const mn = e.target.closest('[data-menu]');
  if (mn) { const nome = mn.dataset.menu; if (S.menu && S.menuDe === nome) fecharMenu(); else abrirMenu(mn, itensMenu(nome), nome); return; }
  const b = e.target.closest('[data-a]'); if (b) acao(b.dataset.a);
});
document.addEventListener('mousedown', e => {
  if (S.menu && !S.menu.contains(e.target) && !e.target.closest('[data-menu]')) fecharMenu();
  if (S.fichaAberta && !e.target.closest('#ficha') && !e.target.closest('[data-a="ficha"]') && !e.target.closest('.pop')) { S.fichaAberta = false; renderFicha(); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (S.menu) { const b = S.menuBtn; fecharMenu(); b && b.focus(); }
  else if ($('.lb')) $('.lb').remove();
  else if ($('.modal')) $('.modal').remove();
  else if (S.fichaAberta) { S.fichaAberta = false; renderFicha(); }
});
async function acao(a) {
  const c = S.convs.get(S.sel);
  try {
    if (a === 'voltar') { S.sel = null; S.fichaAberta = false; $('#app').classList.remove('em-chat'); renderItens(); renderChat(); renderFicha(); }
    else if (a === 'ficha') { S.fichaAberta = !S.fichaAberta; renderFicha(); if (S.fichaAberta) setTimeout(() => { const n = $('#kNome'); n && n.focus({ preventScroll: true }); }, 50); }
    else if (a === 'assumir') { await API.atualizarConversa(c.id, { status: 'humano', atendente_id: S.eu.user_id, motivo: null }); toast('Você assumiu. A A.N.A.B fica quieta nesta conversa.'); }
    else if (a === 'devolver') { await API.atualizarConversa(c.id, { status: 'anab', atendente_id: null, motivo: null }); toast('A A.N.A.B voltou a responder esta conversa.'); }
    else if (a === 'reabrir') await API.atualizarConversa(c.id, { status: 'anab', atendente_id: null });
    else if (a === 'encerrar') { await API.atualizarConversa(c.id, { status: 'encerrada', atendente_id: null, motivo: null }); toast('Conversa encerrada. Se a pessoa escrever de novo, ela volta para a A.N.A.B.'); }
    else if (a === 'cliente' || a === 'lead') {
      if (a === 'cliente' && !confirm('Marcar como cliente?\n\nPor privacidade, as conversas de clientes com a A.N.A.B deixam de aparecer aqui. Elas só voltam quando o cliente pedir ajuda de uma pessoa.')) return;
      await API.atualizarContato(c.contato.id, { tipo: a }); c.contato.tipo = a;
      if (a === 'cliente' && !['precisa_voce', 'humano'].includes(c.status)) { S.convs.delete(c.id); S.sel = null; S.fichaAberta = false; render(); toast('Marcado como cliente.'); }
      else { renderItens(); renderFicha(); toast(a === 'cliente' ? 'Marcado como cliente.' : 'Voltou a ser lead.'); }
    }
    else if (a === 'enviar') enviar();
    else if (a === 'tirar-anexo') { S.anexo = null; renderComp(); }
    else if (a === 'rec') gravar();
    else if (a === 'rec-cancelar') pararGravacao(false);
    else if (a === 'rec-enviar') pararGravacao(true);
    else if (a === 'modelo') modalModelo();
  } catch (x) { toast(esc(x.message), true); }
}

/* =====================================================================
   configurações
   ===================================================================== */
async function telaAnab(box) {
  const cfg = S.config = await API.config(); S.respostas = await API.respostas();
  box.innerHTML = `<h1>A.N.A.B</h1>
    <section class="card"><label class="sw"><input type="checkbox" id="cAtiva" ${cfg.anab_ativa ? 'checked' : ''}><span><b>A.N.A.B responde os leads</b><small>Desligada, todas as mensagens esperam alguém da equipe.</small></span></label></section>
    <section class="card"><h2>O que ela sabe sobre a Provintes</h2>
      <p>Ela responde só com base neste texto. Mudou um preço ou um plano? Edite aqui e salve.</p>
      <textarea class="in" id="cSabe" rows="10">${esc(cfg.anab_conhecimento || '')}</textarea>
      <label class="campo">Avisar no meu WhatsApp quando ela chamar a equipe (opcional)<input class="in" id="cAlerta" inputmode="tel" placeholder="Ex.: 5577999999999" value="${esc(cfg.alerta_numero || '')}"></label>
      <div><button type="button" class="btn pri" id="cSalvar">Salvar</button></div></section>
    <section class="card"><h2>Respostas prontas</h2><p>Ficam no botão ${ic('zap').replace('class="i"', 'class="i" style="width:15px;height:15px;vertical-align:-2px"')} ao lado da caixa de mensagem.</p>
      <div id="rLista"></div>
      <div class="grid2"><label class="campo">Título<input class="in" id="rTit" placeholder="Ex.: Como funciona"></label><label class="campo">Texto<textarea class="in" id="rTxt" rows="2"></textarea></label></div>
      <div><button type="button" class="btn" id="rAdd">Adicionar resposta</button></div></section>`;
  const lista = () => { $('#rLista').innerHTML = S.respostas.map(r => `<div class="rr"><div class="sp"><b>${esc(r.titulo)}</b><p>${esc(r.texto)}</p></div><button type="button" class="ico-s" data-rdel="${r.id}" aria-label="Apagar ${esc(r.titulo)}">${ic('trash')}</button></div>`).join('') || '<p>Nenhuma resposta pronta ainda.</p>'; };
  lista();
  $('#cAtiva').addEventListener('change', async e => { try { await API.salvarConfig({ anab_ativa: e.target.checked }); S.config.anab_ativa = e.target.checked; toast(e.target.checked ? 'A.N.A.B ligada' : 'A.N.A.B desligada'); } catch (x) { toast(esc(x.message), true); } });
  $('#cSalvar').addEventListener('click', async () => { try { await API.salvarConfig({ anab_conhecimento: $('#cSabe').value, alerta_numero: $('#cAlerta').value.replace(/\D/g, '') || null }); toast('Salvo'); } catch (x) { toast(esc(x.message), true); } });
  $('#rAdd').addEventListener('click', async () => { const titulo = $('#rTit').value.trim(), texto = $('#rTxt').value.trim(); if (!titulo || !texto) return toast('Preencha título e texto.', true); try { await API.salvarResposta({ titulo, texto }); S.respostas = await API.respostas(); $('#rTit').value = $('#rTxt').value = ''; lista(); } catch (x) { toast(esc(x.message), true); } });
  box.onclick = async e => { const d = e.target.closest('[data-rdel]'); if (!d || !confirm('Apagar esta resposta pronta?')) return; try { await API.apagarResposta(d.dataset.rdel); S.respostas = await API.respostas(); lista(); } catch (x) { toast(esc(x.message), true); } };
}
async function telaEquipe(box) {
  S.equipe = await API.equipe();
  box.innerHTML = `<h1>Equipe</h1>
    <section class="card"><h2>Quem entra no painel</h2><div>${S.equipe.map(p => `<div class="rr" style="align-items:center"><span class="av" aria-hidden="true">${esc(ini(p.nome))}</span><div class="sp" style="min-width:0"><b>${esc(p.nome)}${p.user_id === S.eu.user_id ? ' (você)' : ''}</b><p>${esc(p.email)}${p.ativo ? '' : ' · desativado'}</p></div>
        ${p.user_id === S.eu.user_id ? `<span class="pill p-gray">${p.papel === 'admin' ? 'Administrador(a)' : 'Atendente'}</span>` : `<label><span class="sr">Acesso de ${esc(p.nome)}</span><select class="in" data-papel="${p.user_id}"><option value="admin" ${p.papel === 'admin' ? 'selected' : ''}>Administrador(a)</option><option value="atendente" ${p.papel !== 'admin' ? 'selected' : ''}>Atendente</option></select></label><button type="button" class="btn" data-ativo="${p.user_id}" data-v="${p.ativo ? 0 : 1}">${p.ativo ? 'Desativar' : 'Reativar'}</button>`}</div>`).join('')}</div>
      <p><b>Administrador(a)</b> mexe na A.N.A.B, nas respostas prontas e na equipe. <b>Atendente</b> só responde conversas.</p></section>
    <section class="card"><h2>Adicionar pessoa</h2>
      <div class="grid2"><label class="campo">Nome<input class="in" id="eNome"></label><label class="campo">E-mail<input class="in" id="eEmail" type="email"></label></div>
      <label class="campo">Acesso<select class="in" id="ePapel"><option value="atendente">Atendente</option><option value="admin">Administrador(a)</option></select></label>
      <div><button type="button" class="btn pri" id="eAdd">Adicionar</button></div><div id="eRes"></div></section>`;
  $('#eAdd').addEventListener('click', async e => {
    e.target.disabled = true;
    try { const r = await API.convidar($('#eNome').value.trim(), $('#eEmail').value.trim(), $('#ePapel').value); $('#eRes').innerHTML = `<p style="background:var(--ok-soft);color:var(--ok);padding:12px;border-radius:10px">Pronto! Senha provisória: <b style="font-family:monospace;font-size:16px">${esc(r.senha)}</b>. Mande para a pessoa por um canal seguro e peça para trocar no primeiro acesso.</p>`; }
    catch (x) { toast(esc(x.message), true); } e.target.disabled = false;
  });
  box.onchange = async e => { const s = e.target.closest('[data-papel]'); if (!s) return; try { await API.mudarPapel(s.dataset.papel, s.value); toast('Acesso alterado'); } catch (x) { toast(esc(x.message), true); } };
  box.onclick = async e => { const b = e.target.closest('[data-ativo]'); if (!b) return; try { await API.mudarAtivo(b.dataset.ativo, b.dataset.v === '1'); telaEquipe(box); } catch (x) { toast(esc(x.message), true); } };
}
function telaConta(box) {
  box.innerHTML = `<h1>Minha conta</h1>
    <section class="card"><h2>${esc(S.eu.nome)}</h2><p>${esc(S.eu.email)} · ${S.eu.papel === 'admin' ? 'Administrador(a)' : 'Atendente'}</p></section>
    <section class="card"><h2>Avisos no computador</h2><p>Receba um aviso quando a A.N.A.B chamar a equipe, mesmo com o painel em outra aba.</p><div><button type="button" class="btn" id="nPerm">Ativar avisos</button></div></section>
    <section class="card"><h2>Trocar senha</h2>
      <div class="grid2"><label class="campo">Nova senha<input class="in" type="password" id="s1" autocomplete="new-password"></label><label class="campo">Repita a nova senha<input class="in" type="password" id="s2" autocomplete="new-password"></label></div>
      <div><button type="button" class="btn" id="sTroca">Trocar senha</button></div></section>
    <div><button type="button" class="btn" id="sSair">${ic('out')}Sair do painel</button></div>`;
  $('#sTroca').addEventListener('click', async () => { const a = $('#s1').value; if (a.length < 8) return toast('A senha precisa de pelo menos 8 caracteres.', true); if (a !== $('#s2').value) return toast('As senhas não são iguais.', true); try { await API.trocarSenha(a); $('#s1').value = $('#s2').value = ''; toast('Senha trocada'); } catch (x) { toast(esc(x.message), true); } });
  $('#nPerm').addEventListener('click', async () => { if (!('Notification' in window)) return toast('Este navegador não mostra avisos.', true); const p = await Notification.requestPermission(); toast(p === 'granted' ? 'Pronto! Você recebe um aviso quando a A.N.A.B chamar a equipe.' : 'Os avisos ficaram bloqueados.', p !== 'granted'); });
  $('#sSair').addEventListener('click', async () => { await API.sair(); location.reload(); });
}

/* =====================================================================
   tempo real
   ===================================================================== */
async function aoMudar(tipo, o) {
  if (!o) return;
  if (tipo === 'mensagem') {
    const L = S.msgs.get(o.conversa_id); if (!L) return;
    const i = L.findIndex(m => m.id === o.id); if (i >= 0) L[i] = { ...L[i], ...o }; else L.push(o);
    if (o.conversa_id === S.sel) renderMsgs();
    return;
  }
  if (tipo === 'contato') { for (const c of S.convs.values()) if (c.contato.id === o.id) Object.assign(c.contato, o); renderItens(); return; }
  const antes = S.convs.get(o.id);
  const nova = await API.conversa(o.id);               // já respeita a regra de privacidade
  if (!nova) { S.convs.delete(o.id); if (S.sel === o.id) { S.sel = null; render(); } else renderItens(); titulo(); return; }
  S.convs.set(nova.id, nova);
  if (nova.status === 'precisa_voce' && (!antes || antes.status !== 'precisa_voce')) avisar(nova);
  if (nova.id === S.sel && nova.nao_lidas) { nova.nao_lidas = 0; API.atualizarConversa(nova.id, { nao_lidas: 0 }).catch(() => { }); }
  if (S.view === 'conversas') {
    renderLista();
    if (nova.id === S.sel && (!antes || antes.status !== nova.status || antes.atendente_id !== nova.atendente_id || antes.motivo !== nova.motivo || (janela(antes.ultima_entrada_em) <= 0) !== (janela(nova.ultima_entrada_em) <= 0))) {
      const t = $('#txt'), v = t && t.value, foco = t && document.activeElement === t;
      renderChat(); renderMsgs(true);
      const t2 = $('#txt'); if (t2 && v) { t2.value = v; t2.dispatchEvent(new Event('input')); } if (t2 && foco) t2.focus();
    }
  }
  titulo();
}
function avisar(c) {
  bip(); toast(`<b>${esc(nomeC(c))}</b> chamou você: ${esc(c.motivo || '')}`);
  try { if (document.hidden && Notification.permission === 'granted') { const n = new Notification('Provintes · chamou você', { body: `${nomeC(c)}: ${c.motivo || ''}` }); n.onclick = () => { focus(); S.view = 'conversas'; render(); abrir(c.id); }; } } catch { }
}

/* =====================================================================
   início
   ===================================================================== */
async function iniciar() {
  if (!(await API.sessao())) return telaLogin();
  S.eu = await API.eu();
  if (!S.eu || !S.eu.ativo) { await API.sair(); return telaLogin('Sua conta ainda não foi liberada no painel. Fale com a administradora.'); }
  const [convs, cfg, resp, eq] = await Promise.all([API.conversas(), API.config().catch(() => null), API.respostas().catch(() => []), API.equipe().catch(() => [])]);
  S.config = cfg; S.respostas = resp; S.equipe = eq;
  S.convs = new Map(convs.map(c => [c.id, c]));
  casca(); render();
  API.assinar(aoMudar);
  setInterval(() => { if (S.view !== 'conversas' || !S.sel || S.rec) return; const c = S.convs.get(S.sel); if (c && janela(c.ultima_entrada_em) <= 0 && !$('.fechada')) renderComp(); }, 60e3);
}
iniciar().catch(e => { console.error(e); telaLogin('Não consegui conectar ao servidor. Confira a internet e tente de novo.'); });

})();
</script>
