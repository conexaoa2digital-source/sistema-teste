<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#0B1F4D;color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px 32px;background:radial-gradient(800px 420px at 80% -10%,rgba(47,107,255,.45),transparent 60%),#0B1F4D}
.marca{display:flex;align-items:center;gap:10px;font-weight:700;font-size:22px;letter-spacing:-.02em;margin-bottom:18px}
.marca svg{width:36px;height:36px}
h1{font-size:clamp(22px,5.5vw,34px);line-height:1.15;margin:0 0 6px;text-align:center;letter-spacing:-.02em}
p{margin:0 0 20px;color:#B9CCFF;text-align:center;font-size:16px}
.tela{position:relative;width:min(960px,100%);aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#000;box-shadow:0 30px 70px -30px rgba(0,0,0,.7)}
video{width:100%;height:100%;display:block}
.play{position:absolute;inset:0;display:grid;place-items:center;border:0;background:rgba(11,31,77,.25);cursor:pointer;color:#fff}
.play span{display:flex;align-items:center;gap:10px;background:#2F6BFF;padding:14px 24px;border-radius:999px;font-weight:700;font-size:17px;box-shadow:0 12px 30px rgba(47,107,255,.5)}
.play svg{width:20px;height:20px}
.acoes{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:999px;font-weight:700;text-decoration:none;font-size:16px}
.btn.pri{background:#25D366;color:#073B1E}
.btn.sec{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
</style>
</head>
<body>
<div class="marca"><svg viewBox="0 0 104 104" aria-hidden="true"><rect width="104" height="104" rx="26" fill="#2F6BFF"/><g transform="translate(52 52) scale(1.15) translate(-32.5 -32)"><rect x="5" y="40" width="9" height="17" rx="4.5" fill="#fff"/><rect x="18" y="29" width="9" height="28" rx="4.5" fill="#fff"/><path d="M31 11a4.5 4.5 0 0 1 4.5-4.5H40v46a4.5 4.5 0 0 1-9 0Z" fill="#fff"/><path d="M42 6.5h3a15 15 0 0 1 0 30h-3Z" fill="#0B1F4D"/></g></svg>Provintes</div>

</div>
<div class="acoes">

<script>
const v=document.getElementById('v'),b=document.getElementById('play');
b.addEventListener('click',()=>{b.remove();v.muted=false;v.play().catch(()=>{});});
